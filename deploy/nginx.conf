# nginx reverse proxy for OpenAlgo on a bare-metal VM.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/openalgo
#   sudo ln -sf /etc/nginx/sites-available/openalgo /etc/nginx/sites-enabled/openalgo
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS (free, auto-renewing):
#   sudo certbot --nginx -d your.domain
#
# TWO upgrade paths matter here and both are easy to miss:
#   1. /socket.io/  -> Flask-SocketIO on :5000 (dashboard live updates)
#   2. /ws          -> the market-data WebSocket proxy on :8765
# Without the Upgrade/Connection headers on BOTH, the pages load fine but
# nothing streams - the failure looks like "the data is just not updating".

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream openalgo_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream openalgo_ws {
    server 127.0.0.1:8765;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # replace with your domain before running certbot

    # Uploaded strategy files and master-contract payloads can be sizeable.
    client_max_body_size 32m;

    access_log /var/log/nginx/openalgo.access.log;
    error_log  /var/log/nginx/openalgo.error.log;

    # ---- Market-data WebSocket proxy (port 8765) ----
    location /ws {
        proxy_pass http://openalgo_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A quiet market can leave a tick stream idle for minutes; the default
        # 60s read timeout would drop the feed and force a reconnect loop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- Flask-SocketIO (dashboard events) ----
    location /socket.io/ {
        proxy_pass http://openalgo_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- Everything else: the Flask app ----
    location / {
        proxy_pass http://openalgo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Order placement can wait on a slow broker API.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
